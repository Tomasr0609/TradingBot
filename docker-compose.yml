services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: traderpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override to use postgres when running via compose
      DATABASE_URL: postgresql+asyncpg://trader:traderpass@db:5432/trading_bot
    volumes:
      - ./logs:/app/logs
    command: sh -c "alembic upgrade head && python scripts/run_bot.py"

volumes:
  pgdata:
